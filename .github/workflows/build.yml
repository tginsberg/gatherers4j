name: Build and Test

on:
  [ pull_request, push ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ['25', '27']
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - uses: gradle/actions/wrapper-validation@v6.4.1

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6.1.0
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'corretto'
          cache: 'gradle'

      - name: Build
        run: ./gradlew build -PjavaVersion=${{ matrix.java-version }} --no-daemon

      - name: Add coverage to PR
        if: github.event_name == 'pull_request'
        id: jacoco
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: ${{ github.workspace }}/**/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Coverage for Java ${{ matrix.java-version }}"
          update-comment: true
