# Used by the deploy job in .github/workflows/publish.yml, which runs the JReleaser CLI against the artifacts that
# `./gradlew publish` staged, unsigned, in build/staging-deploy. Signing happens here so that the signing key is never
# present while Gradle, its plugins, or the tests run.
project:
  name: gatherers4j
  description: An extra set of helpful Stream Gatherers for Java
  authors:
    - Todd Ginsberg
  license: Apache-2.0
  links:
    homepage: https://github.com/tginsberg/gatherers4j
  languages:
    java:
      groupId: com.ginsberg

signing:
  pgp:
    active: ALWAYS
    armored: true

deploy:
  maven:
    mavenCentral:
      release-deploy:
        active: RELEASE
        url: https://central.sonatype.com/api/v1/publisher
        applyMavenCentralRules: true
        stagingRepositories:
          - build/staging-deploy
    nexus2:
      snapshot-deploy:
        active: SNAPSHOT
        url: https://central.sonatype.com/repository/maven-snapshots
        snapshotUrl: https://central.sonatype.com/repository/maven-snapshots
        applyMavenCentralRules: true
        snapshotSupported: true
        closeRepository: false
        releaseRepository: false
        stagingRepositories:
          - build/staging-deploy
